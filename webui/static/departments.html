<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部门管理 | Maker 开源硬件社</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/members.css">
  <link rel="stylesheet" href="/static/departments.css?v=2">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/space" aria-label="返回我的空间"><span class="brand-mark">M</span><span>Maker<span class="brand-caption">OPEN HARDWARE</span></span></a>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航">
      <a class="nav-item" href="/admin"><span class="nav-icon">▦</span>活动管理</a>
      <a class="nav-item" href="/admin/tasks"><span class="nav-icon">☷</span>活动任务</a>
      <a class="nav-item" href="/admin/records"><span class="nav-icon">▤</span>活动记录</a>
      <a class="nav-item" href="/admin/members"><span class="nav-icon">♧</span>社团成员</a>
      <a class="nav-item active" href="/admin/departments" aria-current="page"><span class="nav-icon">⌘</span>部门管理</a>
    </nav>
    <div class="sidebar-bottom"><span class="profile-avatar" id="profile-avatar">M</span><div><strong id="profile-username"></strong><small id="profile-role"></small></div></div>
  </aside>
  <main class="main-content members-main">
    <header class="topbar"><div class="breadcrumbs">工作空间 <span>/</span> <strong>部门管理</strong></div><div class="top-actions"><a class="mobile-task-link" href="/admin">活动管理</a><a class="mobile-task-link" href="/admin/members">社团成员</a><button class="theme-button" id="theme-toggle" type="button" title="切换暗色模式" aria-label="切换暗色模式">☾</button><button class="text-button" id="logout-button" type="button">退出</button></div></header>
    <section class="page-heading"><div><div class="eyebrow"><span class="eyebrow-dot"></span> CLUB DEPARTMENTS</div><h1>部门管理</h1><p>维护部门名称与面向社员的介绍。</p></div><button class="primary-button" id="create-department" type="button"><span class="plus">+</span> 添加部门</button></section>
    <section class="activity-section members-section">
      <div class="section-heading"><div><h2>部门列表</h2></div><span class="result-count" id="department-count"></span></div>
      <div class="table-wrap"><table><thead><tr><th>部门名称</th><th>部门介绍</th><th>宣传图</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="department-rows"></tbody></table><div class="loading-state" id="department-status" role="status">正在载入部门…</div></div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <dialog id="department-dialog" class="activity-dialog">
    <form id="department-form">
      <div class="dialog-heading"><div><div class="eyebrow">DEPARTMENT DETAILS</div><h2 id="dialog-title">添加部门</h2></div><button type="button" class="close-button" id="close-dialog" aria-label="关闭">×</button></div>
      <input type="hidden" id="department-id">
      <div class="form-grid">
        <label class="field field-wide">部门名称<input id="department-name" maxlength="50" required></label>
        <label class="field field-wide">部门介绍<textarea id="department-description" rows="6" maxlength="2000" placeholder="介绍部门的方向、日常工作或欢迎加入的方式"></textarea></label>
        <label class="field field-wide">详细介绍<textarea id="department-detail" rows="10" maxlength="5000" placeholder="详细介绍部门的工作内容、特色方向、日常活动与加入方式"></textarea></label>
        <label class="field field-wide">部门宣传图<input id="department-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><span class="field-note">单张图片，支持 PNG / JPEG / WebP / GIF，最大 5 MB</span></label>
        <div class="department-image-preview" id="department-image-preview" hidden></div>
      </div>
      <div class="dialog-error" id="dialog-error" role="alert"></div>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-dialog">取消</button><button class="primary-button" type="submit">保存部门</button></div>
    </form>
  </dialog>
  <script src="/static/departments.js" defer></script>
</body>
</html>
